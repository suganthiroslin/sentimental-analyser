{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SentimentAI</title>

    <link rel="stylesheet"
          href="{% static 'sentiment/css/style.css' %}">

    <style>
        .auth-container {
            min-height: calc(100vh - 120px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .auth-card h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .auth-card h1 span {
            color: #ec4899;
        }

        .auth-description {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #6366f1;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #4338ca;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .auth-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Sentiment<span>AI</span>
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
    </div>

</nav>


<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome <span>Back</span></h1>

        <p class="auth-description">
            Login to your SentimentAI account
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required>
            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button type="submit" class="login-button">
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </p>

    </div>

</div>


<footer>

    <p>© 2026 Sentiment Analysis System</p>

</footer>

</body>

</html>
