```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SentimentAI</title>


    <link rel="stylesheet"
          href="css/style.css">


    <style>

        .auth-container {

            min-height: calc(100vh - 120px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

        }


        .auth-card {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);

        }


        .auth-card h1 {

            text-align: center;

            font-size: 32px;

            margin-bottom: 10px;

        }


        .auth-card h1 span {

            color: #ec4899;

        }


        .auth-description {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            box-sizing: border-box;

        }


        .form-group input:focus {

            border-color: #6366f1;

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .login-button:hover {

            background: #4338ca;

        }


        .login-button:disabled {

            background: #9ca3af;

            cursor: not-allowed;

        }


        .auth-footer {

            text-align: center;

            margin-top: 20px;

            color: #6b7280;

        }


        .auth-footer a {

            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;

        }


        .message {

            display: none;

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

        }


        .error-message {

            background: #fee2e2;

            color: #b91c1c;

        }


        .success-message {

            background: #dcfce7;

            color: #166534;

        }

    </style>

</head>


<body>


    <!-- ==================== Navigation Bar ==================== -->

    <nav class="navbar">


        <div class="logo">

            Sentiment<span>AI</span>

        </div>



        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

        </div>


    </nav>



    <!-- ==================== Login Section ==================== -->

    <div class="auth-container">


        <div class="auth-card">


            <h1>

                Welcome <span>Back</span>

            </h1>



            <p class="auth-description">

                Login to your SentimentAI account

            </p>



            <!-- Error message -->

            <div id="errorMessage"
                 class="message error-message">

            </div>



            <!-- Success message -->

            <div id="successMessage"
                 class="message success-message">

            </div>



            <!-- Login Form -->

            <form id="loginForm">


                <div class="form-group">


                    <label for="username">

                        Username

                    </label>



                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>


                </div>



                <div class="form-group">


                    <label for="password">

                        Password

                    </label>



                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>


                </div>



                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    Login

                </button>


            </form>



            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>


        </div>

    </div>



    <!-- ==================== Footer ==================== -->

    <footer>

        <p>

            © 2026 Sentiment Analysis System

        </p>

    </footer>


    <!-- Login JavaScript -->

    <script>

        const API_URL =
            "https://sentimental-analyser-u3ht.onrender.com";


        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const loginButton =
                    document
                        .getElementById("loginButton");


                const errorMessage =
                    document
                        .getElementById("errorMessage");


                const successMessage =
                    document
                        .getElementById("successMessage");


                errorMessage.style.display = "none";

                successMessage.style.display = "none";


                loginButton.disabled = true;

                loginButton.textContent = "Logging in...";


                try {


                    const response =
                        await fetch(
                            `${API_URL}/api/login/`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                credentials: "include",

                                body: JSON.stringify({

                                    username: username,

                                    password: password

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Invalid username or password."
                        );

                    }


                    /*
                     * Save login information
                     * temporarily in browser.
                     */

                    localStorage.setItem(
                        "isLoggedIn",
                        "true"
                    );


                    localStorage.setItem(
                        "username",
                        data.username || username
                    );


                    successMessage.textContent =
                        "Login successful! Redirecting...";


                    successMessage.style.display =
                        "block";


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 1000);


                }

                catch (error) {


                    console.error(
                        "Login error:",
                        error
                    );


                    errorMessage.textContent =
                        error.message ||
                        "Unable to login. Please try again.";


                    errorMessage.style.display =
                        "block";


                }


                loginButton.disabled = false;

                loginButton.textContent = "Login";


            });

    </script>


</body>

</html>
